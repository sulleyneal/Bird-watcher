<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wc2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="grainy">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="5" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 0.3  0 0 0 0 0.26 0 0 0 0 0.18  0 0 0 0.06 0" result="g"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g"/></feMerge>
    </filter>
    <radialGradient id="bgg" cx="0.42" cy="0.38" r="0.85">
      <stop offset="0%" stop-color="#f8f3e2"/><stop offset="100%" stop-color="#efe6cc"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgg)" filter="url(#grainy)"/>
  <path d="M256 60 C 380 55 460 140 452 262 C 446 385 370 458 250 452 C 130 448 58 372 62 252 C 66 135 140 64 256 60 Z"
        fill="#8aa7b5" opacity="0.30" filter="url(#wc)"/>
  <path d="M250 90 C 350 86 424 152 420 254 C 416 356 352 424 252 420 C 152 418 94 352 96 252 C 98 152 156 92 250 90 Z"
        fill="#c8d4c2" opacity="0.35" filter="url(#wc2)"/>
  <!-- branch -->
  <path d="M96 360 Q 250 338 424 352" fill="none" stroke="#6b543c" stroke-width="14" stroke-linecap="round" filter="url(#wc2)" opacity="0.85"/>
  <path d="M300 348 Q 330 318 352 308" fill="none" stroke="#6b543c" stroke-width="7" stroke-linecap="round" filter="url(#wc2)" opacity="0.7"/>
  <ellipse cx="360" cy="300" rx="18" ry="9" fill="#5d7350" opacity="0.6" filter="url(#wc2)" transform="rotate(-30 360 300)"/>
  <!-- tail -->
  <path d="M196 268 L 118 322 L 132 344 L 206 296 Z" fill="#8f2d1f" opacity="0.72" filter="url(#wc)"/>
  <!-- legs -->
  <path d="M238 330 L 234 356 M 268 328 L 272 356" stroke="#5b4a35" stroke-width="7" stroke-linecap="round" filter="url(#wc2)" opacity="0.85"/>
  <!-- body -->
  <path d="M256 180 C 320 176 350 220 344 268 C 338 316 300 340 252 338 C 204 336 176 304 178 258 C 180 214 208 183 256 180 Z"
        fill="#b8402e" opacity="0.78" filter="url(#wc)"/>
  <path d="M280 240 C 316 240 330 268 324 292 C 318 316 292 328 264 326 C 236 324 224 300 228 276 C 232 252 252 240 280 240 Z"
        fill="#c4553b" opacity="0.6" filter="url(#wc2)"/>
  <!-- wing -->
  <path d="M262 210 C 232 212 208 236 202 268 C 198 290 212 300 232 292 C 256 282 272 254 274 228 Z"
        fill="#9c3322" opacity="0.7" filter="url(#wc)"/>
  <!-- head -->
  <path d="M312 128 C 344 126 366 148 366 176 C 366 204 344 222 316 222 C 288 222 270 202 270 176 C 270 150 286 130 312 128 Z"
        fill="#b8402e" opacity="0.8" filter="url(#wc)"/>
  <!-- crest -->
  <path d="M296 138 L 306 96 L 322 86 L 330 100 L 340 134 Z" fill="#b8402e" opacity="0.78" filter="url(#wc)"/>
  <!-- mask -->
  <path d="M318 168 L 366 164 L 380 182 L 360 194 L 322 188 Z" fill="#33261f" opacity="0.8" filter="url(#wc2)"/>
  <!-- beak -->
  <path d="M366 168 L 398 176 L 366 190 Z" fill="#cc6b3d" opacity="0.95" filter="url(#wc2)"/>
  <!-- eye -->
  <circle cx="330" cy="168" r="9" fill="#2e2620"/>
  <circle cx="333" cy="165" r="2.8" fill="#f6f1e3" opacity="0.9"/>
  <!-- ink accents -->
  <path d="M292 136 Q 322 118 348 142" fill="none" stroke="#42392b" stroke-width="3.4" stroke-linecap="round" opacity="0.5" filter="url(#wc2)"/>
  <path d="M196 292 Q 240 344 312 322" fill="none" stroke="#42392b" stroke-width="3.4" stroke-linecap="round" opacity="0.45" filter="url(#wc2)"/>
</svg>
